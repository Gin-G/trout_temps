app:
  name: trout-temps
  instances: 1
  group: trout-temps
  fqdn: trout-temps.nickknows.net
  image: docker.io/ncging/trout-temps:2026-08-20.16.41
  port: 8080
  # Static nginx: tiny and CPU-idle, but give it room for a traffic spike.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    path: /healthz
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
