apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    group: {{ .Values.app.group }}
spec:
  replicas: {{ .Values.app.instances }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
      # The base image is nginx-unprivileged: it already runs as UID 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Values.app.name }}
        image: {{ .Values.app.image }}
        ports:
        - containerPort: {{ .Values.app.port }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # Not readOnlyRootFilesystem: the base image's entrypoint patches its
          # own config at startup — 10-listen-on-ipv6-by-default.sh adds the
          # `listen [::]:8080` line and 30-tune-worker-processes.sh sizes the
          # worker count to the CPU limit. Both fail silently on a read-only
          # rootfs, leaving the container IPv4-only with a worker per host core.
        resources:
          {{- toYaml .Values.app.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.app.probes.path }}
            port: {{ .Values.app.port }}
          {{- toYaml .Values.app.probes.liveness | nindent 10 }}
        readinessProbe:
          httpGet:
            path: {{ .Values.app.probes.path }}
            port: {{ .Values.app.port }}
          {{- toYaml .Values.app.probes.readiness | nindent 10 }}
        # The unprivileged image keeps its pid file and all temp paths under
        # /tmp; give it real volumes rather than writing into the image layer.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
