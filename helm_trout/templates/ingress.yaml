apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name:  {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app:  {{ .Values.app.name }}
    group: {{ .Values.app.group }}
  annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      # This hostname is served through the Cloudflare Tunnel, so its DNS record
      # is a CNAME to <tunnel-id>.cfargotunnel.com rather than an A record to the
      # house. external-dns owns this record (see the heritage TXT) and would
      # upsert the A record straight back over the CNAME, so it has to be told
      # to leave this Ingress alone. Removing the target annotation is not
      # enough on its own -- without a target external-dns falls back to the
      # Ingress status, which here is the private LoadBalancer IPs.
      external-dns.alpha.kubernetes.io/exclude: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ .Values.app.name }}-redirect-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      - {{ .Values.app.fqdn }}
      secretName: {{ .Values.app.name }}-tls
  rules:
    - host: {{ .Values.app.fqdn }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.app.name }}
              port:
                number: {{ .Values.app.port}}
