# Included from every location that sets its own add_header, since nginx drops
# inherited add_header directives as soon as a child block declares one.
# The pages talk to USGS over https, load a CARTO basemap and report to Google
# Analytics; Leaflet is served from this origin, so gtag.js is the only
# third-party script allowed.
#
# stats.g.doubleclick.net and www.google.com are the Google Signals beacons
# (/j/collect and /ads/ga-audiences). Plain GA4 measurement does not need them;
# they only fire when Google Signals is enabled on the property. Each is opened
# for img-src and connect-src because gtag picks pixel or fetch per browser,
# and for no other directive — neither may serve script.
#
# Keep each value on ONE line. nginx does not treat a trailing backslash as a
# line continuation: it copies the backslash and the newline into the header
# value, so the response goes out with broken header lines and every strict
# proxy in front of it (Traefik included) answers 500 while nginx logs a 200.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.google-analytics.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com; connect-src 'self' https://waterservices.usgs.gov https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
