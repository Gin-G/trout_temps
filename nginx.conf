server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # --- security headers ---
    include /etc/nginx/security-headers.conf;

    # Generated pages are directories, so nginx 301s /river/foo to /river/foo/.
    # It builds that Location from its own scheme and listen port, which behind
    # Traefik means redirecting an https visitor to http://host:8080/ — a broken
    # URL, and one a crawler would follow. Relative redirects sidestep the whole
    # question: the browser resolves them against the address it actually used.
    absolute_redirect off;

    # --- performance ---
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache HTML briefly (data is fetched client-side anyway, so HTML can be cached).
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    # Vendored Leaflet is version-pinned in the image: cache it hard.
    location ^~ /vendor/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shared CSS and JS. Not content-hashed, so a deploy has to be able to change
    # them: an hour, not a year.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Generated pages. Each is a directory holding index.html, so a request
    # without the trailing slash gets nginx's own 301 onto the canonical form.
    # The readings baked into them are a day old at most, so ten minutes of
    # cache costs nothing and takes the load off a page nobody has visited yet.
    location ^~ /river/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600";
    }
    location ^~ /rivers/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600";
    }
    location ^~ /gage/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600";
    }
    location ^~ /near/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600";
    }

    # robots.txt and the sitemap index and its three children.
    location ~* \.(xml|txt)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't leak nginx version
    server_tokens off;
}
